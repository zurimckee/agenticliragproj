<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="assets/favicon.ico">
    
</head>
<header>
    <title>
        projbyzuri
    </title>
</header>
    <body>
        <style>
            .card-tag {
                font-family: 'Segoe UI', sans-serif;
                font-size: 14px;
                letter-spacing: 0.06em;
                color: #555580;
                text-transform: lowercase;
                margin-bottom: auto;
            }

            .card-tag:hover{
                color: #3d4367;
                transition-duration: 0.3s;
                text-decoration: underline;
            }

            .home-grid a{
                text-decoration: none;
            }

        </style>
        <div class="music-player">
            <audio id="music" autoplay muted loop>
                <source src="assets/songs/pinknwhite.flac" type="audio/flac">
            </audio>
            <button id="play-pause" onclick="toggleMusic()">
                <img id="play-icon" src="assets/voldown.png" alt="Play">
            </button>
        </div>

        <img src="assets/myname.png" alt="name sticker" class="name-img">

        <div class="home-grid">
            <a href="about.html">
                <img src="assets/landing/pinkfolder.png" alt="pink folder" class="home-img">
                <div class="card-tag">
                    <p>about</p>
                </div>
            </a>
            <a href="contact.html">
                <img src="assets/landing/whitefoolder.png" alt="white folder" class="home-img">
                <div class="card-tag">
                    <p>contact</p>
                </div>
            </a>
            <a href="projects.html">
                <img src="assets/landing/purplefolder.png" alt="purple folder" class="home-img">
                <div class="card-tag">
                    <p>projects</p>
                </div>
            </a>
            <a href="media.html">
                <img src="assets/landing/greenfolder.png" alt="green folder" class="home-img">
                <div class="card-tag">
                    <p>media</p>
                </div>
            </a>
            <a href="log.html">
                <img src="assets/landing/yellowfolder.png" alt="yellow folder" class="home-img">
                <div class="card-tag">
                    <p>log</p>
                </div>
            </a>
            <a href="art.html">
                <img src="assets/landing/bluegrayfolder.png" alt="blue-gray folder" class="home-img">
                <div class="card-tag">
                    <p>art</p>
                </div>
            </a>
        </div>
    </body>
    <script src="script.js"></script>
</html>
